<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Mensajería</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="contenedor">

<h1>Sistema de Mensajería</h1>

<form action="guardar.php" method="POST" id="formulario">

<input type="text" name="remitente" placeholder="Remitente" required>

<input type="text" name="destinatario" placeholder="Destinatario" required>

<input type="text" name="telefonoRemitente" placeholder="Teléfono remitente" required>

<input type="text" name="telefonoDestinatario" placeholder="Teléfono destinatario" required>

<input type="text" name="ciudadOrigen" placeholder="Ciudad origen" required>

<input type="text" name="ciudadDestino" placeholder="Ciudad destino" required>

<input type="text" name="direccion" placeholder="Dirección entrega" required>

<select name="tipoPaquete">

<option>Documento</option>

<option>Caja</option>

<option>Sobre</option>

<option>Fragil</option>

</select>

<input type="number" step="0.1" name="peso" placeholder="Peso (Kg)" required>

<textarea name="descripcion" placeholder="Descripción"></textarea>

<input type="date" name="fecha" required>

<input type="submit" value="Registrar Envío">

</form>

<br>

<a href="listar.php">
<button>Ver Registros</button>
</a>

</div>

<script src="script.js"></script>

</body>
</html>
